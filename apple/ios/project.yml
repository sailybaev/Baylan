name: BaylanIOS
options:
  bundleIdPrefix: com.baylan
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BaylanCore:
    path: ../shared

settings:
  base:
    PRODUCT_NAME: Baylan
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
    STRIP_INSTALLED_PRODUCT: NO
    COPY_PHASE_STRIP: NO

targets:

  BaylanIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Sources/BaylanIOS
        type: group
    resources:
      - path: Sources/BaylanIOS/Resources
    dependencies:
      - package: BaylanCore
    info:
      path: Sources/BaylanIOS/Info.plist
      properties:
        CFBundleDisplayName: Baylan
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Baylan uses your local network to discover and connect with nearby devices for offline mesh messaging."
        NSBonjourServices:
          - _baylan-mesh._tcp
          - _baylan-mesh._udp
        NSBluetoothAlwaysUsageDescription: "Baylan uses Bluetooth to discover nearby devices and relay messages without internet."
        NSCameraUsageDescription: "Baylan uses the camera to scan QR codes for adding contacts securely."
    entitlements:
      path: Sources/BaylanIOS/BaylanIOS.entitlements
      properties:
        com.apple.security.application-groups: []
        com.apple.security.network.client: true
        com.apple.security.network.server: true

  BaylanIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/BaylanIOSTests
    dependencies:
      - target: BaylanIOS
      - package: BaylanCore
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BaylanIOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BaylanIOS"

schemes:
  BaylanIOS:
    build:
      targets:
        BaylanIOS: all
        BaylanIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BaylanIOSTests
    profile:
      config: Release
    archive:
      config: Release
