<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    PULSE v2 — Pulse + Peers
    Same arcs as v1, but three peer nodes sit directly ON the arc paths.
    The nodes occlude the arc stroke beneath them, making the arc appear
    to "knot" at each peer — as if the signal has been received there.

    Peer positions (all sitting on arc circumferences):
      Node A — outer arc, straight up (90°):
        x = 50,  y = 50 - 26 = 24

      Node B — outer arc, ~200° (lower-left):
        cos(200°) = -0.9397,  sin(200°) = -0.342
        x = 50 + 26 × (-0.9397) = 25.6
        y = 50 - 26 × (-0.342) = 58.9  [SVG y-down inverts sin]

      Node C — inner arc, ~20° (right, slightly above center):
        cos(20°) =  0.9397,  sin(20°) =  0.342
        x = 50 + 15 ×  0.9397 = 64.1
        y = 50 - 15 ×  0.342  = 44.9
  -->
  <rect width="100" height="100" rx="22" fill="#1C1C1E"/>

  <!-- Outer arc -->
  <path d="M 31.62 68.38 A 26 26 0 1 1 68.38 68.38"
        fill="none" stroke="white" stroke-width="2.5"
        stroke-linecap="round" opacity="0.45"/>

  <!-- Inner arc -->
  <path d="M 39.39 60.61 A 15 15 0 1 1 60.61 60.61"
        fill="none" stroke="white" stroke-width="3.5"
        stroke-linecap="round"/>

  <!-- Center node -->
  <circle cx="50" cy="50" r="5.5" fill="white"/>

  <!-- Peer nodes — drawn last so they sit on top of arcs -->
  <!-- Node A: outer arc, top -->
  <circle cx="50"  cy="24"  r="3.5" fill="white"/>
  <!-- Node B: outer arc, lower-left -->
  <circle cx="25.6" cy="58.9" r="3.5" fill="white"/>
  <!-- Node C: inner arc, right -->
  <circle cx="64.1" cy="44.9" r="3.5" fill="white"/>
</svg>
