<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    BAYLA — "TRIAD"
    Concept: Three equal peers forming a triangle mesh — the purest
    visual expression of decentralized, peer-to-peer communication.
    No hierarchy; every node is equal. The triangle is stable and
    trustworthy. Connecting lines are semi-transparent to keep the
    dots primary and avoid visual clutter at small sizes.

    Triangle vertices (circumradius = 22, pointing up):
      Top:          (50,   28)
      Bottom-left:  (30.9, 61)
      Bottom-right: (69.1, 61)
  -->

  <!-- App icon background -->
  <rect width="100" height="100" rx="22" fill="#007AFF"/>

  <!-- Connecting lines — drawn first (behind nodes) -->
  <line x1="50"   y1="28" x2="30.9" y2="61"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="30.9" y1="61" x2="69.1" y2="61"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="69.1" y1="61" x2="50"   y2="28"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Peer nodes — equal size, pure white -->
  <circle cx="50"   cy="28" r="5.5" fill="white"/>
  <circle cx="30.9" cy="61" r="5.5" fill="white"/>
  <circle cx="69.1" cy="61" r="5.5" fill="white"/>

</svg>
