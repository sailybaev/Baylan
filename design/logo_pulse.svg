<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    BAYLA — "PULSE"
    Concept: A central node radiating two concentric arcs outward.
    The arcs are horseshoe-shaped (open at the bottom), suggesting
    a signal propagating through space — not WiFi (which radiates
    from a fixed bottom point), but a peer broadcasting into the mesh.
    Stroke-linecap="round" gives the ends softness, Apple-style.
  -->

  <!-- App icon background -->
  <rect width="100" height="100" rx="22" fill="#1C1C1E"/>

  <!-- Outer arc — r=26, 270° sweep open at bottom, 45% opacity -->
  <!-- Endpoints at ±45° below horizontal: (31.62, 68.38) and (68.38, 68.38) -->
  <path
    d="M 31.62 68.38 A 26 26 0 1 1 68.38 68.38"
    fill="none"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.45"/>

  <!-- Inner arc — r=15, 270° sweep open at bottom, full opacity -->
  <!-- Endpoints at ±45° below horizontal: (39.39, 60.61) and (60.61, 60.61) -->
  <path
    d="M 39.39 60.61 A 15 15 0 1 1 60.61 60.61"
    fill="none"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"/>

  <!-- Center node — the "self" in the mesh -->
  <circle cx="50" cy="50" r="5.5" fill="white"/>

</svg>
